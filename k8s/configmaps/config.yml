apiVersion: v1
kind: ConfigMap
metadata:
  name: llmflow-config
data:
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "llmflow"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis:6379/2"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET: "llmflow"
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
  GPU_COST_PER_HOUR: "2.50"
  BACKEND_HOST: "0.0.0.0"
  BACKEND_PORT: "8000"
---
apiVersion: v1
kind: Secret
metadata:
  name: llmflow-secrets
type: Opaque
stringData:
  POSTGRES_USER: "llmflow"
  POSTGRES_PASSWORD: "change-me-in-production"
  DATABASE_URL: "postgresql+asyncpg://llmflow:change-me-in-production@postgres:5432/llmflow"
  MINIO_ACCESS_KEY: "llmflow_minio"
  MINIO_SECRET_KEY: "change-me-in-production"
  SECRET_KEY: "change-me-in-production"
