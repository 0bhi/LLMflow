apiVersion: v1
kind: Service
metadata:
  name: llmflow-backend
spec:
  selector:
    app: llmflow
    component: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: llmflow-inference
spec:
  selector:
    app: llmflow
    component: inference
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: llmflow-frontend
spec:
  selector:
    app: llmflow
    component: frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llmflow-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  rules:
    - host: llmflow.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: llmflow-backend
                port:
                  number: 8000
          - path: /inference
            pathType: Prefix
            backend:
              service:
                name: llmflow-inference
                port:
                  number: 8001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llmflow-frontend
                port:
                  number: 3000
