services:
  backend:
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    volumes: []
    environment:
      - DEBUG=false

  worker:
    command: >
      celery -A app.workers.celery_app worker --loglevel=warning --concurrency=4
    volumes: []

  inference:
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 2
    volumes: []

  frontend:
    command: npm run start
    volumes: []
